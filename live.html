<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひぐらし</title>

  <link rel="stylesheet" href="shared-style.css">

  <style>
    /* ライブ予定の見出し */
    .schedule {
      max-width: 1120px;
      margin: auto;
      padding: 170px 7% 100px;
    }

    .schedule-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      align-items: center;
      gap: 32px;
      margin-bottom: 40px;
    }

    .schedule-intro {
      margin: 0;
      font-size: 22px;
      line-height: 1.8;
    }

    .event-title {
      margin: 18px 0;
    }

    /* 見出しと説明文の横に、小さく写真を添える */
    .schedule-photo {
      margin: 0;
    }

    .schedule-photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 各ライブの情報 */
    .event {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 45px;
      padding: 48px 0;
      border-bottom: 1px solid var(--line);
    }

    .event:first-of-type {
      border-top: 1px solid var(--line);
    }

    .event-date {
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .event-date span {
      display: block;
      margin-top: 12px;
      font-size: 36px;
    }


    /* 時間と料金は、公演ごとにここで案内 */
    .event-details {
      display: grid;
      gap: 16px;
      margin: 24px 0 32px;
    }

    .event-details > div {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 20px;
    }

    .event-details dt {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .event-details dd {
      margin: 0;
      font-size: 19px;
      line-height: 1.8;
    }

    /* 各公演のチケットサイト・予約フォームへ進むボタン */
    .reserve-link {
      display: block;
      width: 100%;
      padding: 22px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: #e6e8dc;
      font-size: 21px;
      text-align: center;
    }

    @media (max-width: 850px) {
      .schedule {
        padding-top: 160px;
      }
    }

    @media (max-width: 700px) {
      .schedule-heading {
        grid-template-columns: minmax(0, 1fr) 110px;
        gap: 16px;
        margin-bottom: 32px;
      }

      .schedule-heading .page-title {
        margin: 0 0 12px;
        font-size: 24px;
      }


      .schedule-intro {
        font-size: 15px;
      }

      .event {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 32px 0;
      }

      .event-date span {
        display: inline;
        margin-left: 20px;
        font-size: 30px;
      }

      .event-details > div {
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
      }

      .event-details dd {
        font-size: 18px;
      }

      .reserve-link {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
{% include_relative header.html %}

</html>
