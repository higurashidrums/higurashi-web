<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひぐらし</title>

  <style>
    /* 基本設定 */
    :root {
      --paper: #f5f2ea;
      --ink: #353c33;
      --muted: #858879;
      --line: #d6d8cb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
      outline-offset: 5px;
    }

    h1,
    h2 {
      font-weight: 400;
    }

    /* 画像の表示方法 */
    .brand-handwriting,
    .custom-heading {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    /* 固定ヘッダー */
    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 30px;
      row-gap: 10px;
      align-items: center;
      padding: 18px 5%;
      background: linear-gradient(var(--paper) 72%, transparent);
    }

    .brand {
      grid-column: 1;
      grid-row: 1 / 3;
      display: block;
      width: 125px;
      line-height: 1;
    }

    /* 配信・SNS */
    .header-social {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
    }

    .header-social a {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
    }

    .header-social svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    .header-social .music-stream {
      width: auto;
      gap: 6px;
      padding-right: 12px;
      border-right: 1px solid #9ba28e80;
    }

    .music-stream span {
      font-size: 14px;
      white-space: nowrap;
    }

    /* ページ移動 */
    .main-nav,
    .nav-action,
    .header-social .music-stream {
      display: flex;
      align-items: center;
    }

    .main-nav {
      grid-column: 2;
      grid-row: 2;
      justify-content: flex-end;
      gap: 12px;
      font-size: 16px;
      letter-spacing: 0.08em;
    }

    .nav-action {
      justify-content: center;
      width: 220px;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid #a7ae9c;
      border-radius: 3px;
      background: var(--paper);
      text-align: center;
    }

    /* ライブ予定の見出し */
    .schedule {
      max-width: 1120px;
      margin: auto;
      padding: 170px 7% 100px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.2em;
    }

    .lettering-title {
      min-height: 65px;
      margin: 35px 0;
      line-height: 1;
    }

    .custom-heading {
      max-width: 520px;
    }

    .schedule-intro {
      margin-bottom: 60px;
      font-size: 22px;
      line-height: 1.8;
    }

    /* 各ライブの情報 */
    .event {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 45px;
      padding: 48px 0;
      border-bottom: 1px solid var(--line);
    }

    .event:first-of-type {
      border-top: 1px solid var(--line);
    }

    .event-date {
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .event-date span {
      display: block;
      margin-top: 12px;
      font-size: 36px;
    }

    .event-info h2 {
      margin: 18px 0;
      font-size: 36px;
      line-height: 1.5;
      letter-spacing: 0.1em;
    }

    .event-note {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    /* 取り置きメールを開くボタン */
    .reserve-link {
      display: block;
      width: 100%;
      padding: 22px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: #e6e8dc;
      font-size: 21px;
      text-align: center;
    }

    /* タブレット・スマートフォン用 */
    @media (max-width: 850px) {
      .site-header {
        column-gap: 12px;
        row-gap: 12px;
        padding: 12px 5% 20px;
      }

      .brand {
        grid-row: 1;
        width: 105px;
      }

      .header-social {
        gap: 8px;
      }

      .header-social a {
        width: 28px;
        height: 28px;
      }

      .header-social svg {
        width: 21px;
        height: 21px;
      }

      .main-nav {
        grid-column: 1 / -1;
        width: 100%;
        gap: 10px;
      }

      .main-nav .optional {
        display: none;
      }

      .nav-action {
        flex: 1;
        width: auto;
        min-width: 0;
        min-height: 46px;
        padding: 12px 5px;
        font-size: 14px;
      }

      .schedule {
        padding-top: 160px;
      }
    }

    @media (max-width: 700px) {
      .lettering-title {
        min-height: 50px;
      }

      .schedule-intro {
        font-size: 20px;
      }

      .event {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 32px 0;
      }

      .event-date span {
        display: inline;
        margin-left: 20px;
        font-size: 30px;
      }

      .event-info h2 {
        font-size: 30px;
      }

      .reserve-link {
        font-size: 19px;
      }
    }

    @media (max-width: 400px) {
      .header-social {
        gap: 5px;
      }

      .header-social a {
        width: 25px;
      }

      .header-social .music-stream {
        gap: 3px;
        padding-right: 7px;
      }

      .music-stream span {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .brand {
        width: 85px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ひぐらし トップへ">
      <svg

              values="
                0 0 0 0 .208
                0 0 0 0 .235

                -.2126 -.7152 -.0722 0 .75

            />
            <feComponentTransfer>
              <feFuncA type="linear" slope="10" intercept="-.2" />

          <clipPath id="brand-clip" clipPathUnits="userSpaceOnUse">
            <rect x="725" y="125" width="160" height="55" />
          </clipPath>
        </defs>

        <image
          href="assets/card-original.png"
          width="1145"
          height="1395"

      <a

      <a
        href="https://x.com/_sonohigurashii"

        rel="noopener"
        aria-label="X"
      >

      <a

        </svg>

      <a
        href="https://www.tiktok.com/@_sonohigurashii"
        target="_blank"
        rel="noopener"

      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 3v12a4 4 0 1 1-4-4M14 3c0 4 3 6 6 6" />
        </svg>
      </a>
    </div>

    <!-- ページ移動 -->
    <nav class="main-nav" aria-label="メインメニュー">
      <a class="optional" href="index.html">トップへ</a>
      <a class="nav-action" href="live.html">ライブ・取り置き</a>
      <a class="nav-action" href="booking.html">
        出演のご依頼はこちら
      </a>
    </nav>
  </header>

  <main class="schedule">

    <h1 class="lettering-title">
      <svg

        <p class="event-note">

  </main>
</body>
</html>
