<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひぐらし</title>

  <style>
    :root {
      --paper: #f5f2ea;
      --ink: #353c33;
      --muted: #858879;
      --line: #d6d8cb;
      --font: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    a,
    button,
    input,
    textarea {
      outline-offset: 5px;
    }

    button {
      cursor: pointer;
    }

    /* 画面の構成的な部分 */
    .main-nav,
    .nav-button,
    .social-links .music-link {
      display: flex;
      align-items: center;
    }

    .main-nav,
    .social-links {
      justify-content: flex-end;
    }

    .brand-logo,
    .booking-title svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    /* ヘッダー のフォントとか*/
    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 30px;
      row-gap: 10px;
      align-items: center;
      padding: 18px 5%;
      background: linear-gradient(var(--paper) 72%, transparent);
    }

    .brand {
      grid-column: 1;
      grid-row: 1 / 3;
      display: block;
      width: 125px;
      line-height: 1;
    }

    .social-links {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      gap: 16px;
    }

    .social-links a {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
    }

    .social-links svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    .social-links .music-link {
      gap: 6px;
      width: auto;
      padding-right: 12px;
      border-right: 1px solid #9ba28e80;
    }

    .music-link span {
      font-size: 14px;
      white-space: nowrap;
    }

    .main-nav {
      grid-column: 2;
      grid-row: 2;
      gap: 12px;
      font-size: 16px;
      letter-spacing: 0.08em;
    }

    .nav-button {
      justify-content: center;
      width: 220px;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid #a7ae9c;
      border-radius: 3px;
      background: var(--paper);
      text-align: center;
    }

    /* 出演依頼 */
    main {
      padding-top: 130px;
    }

    .booking {
      margin-top: 80px;
      padding: 100px 8%;
      background: #e9ecdf;
    }

    .booking-layout {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 12%;
    }

    .section-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.2em;
    }

    .booking-title {
      min-height: 65px;
      margin: 25px 0 35px;
      line-height: 1;
    }

    .booking-title svg {
      max-width: 520px;
    }

    .description {
      font-size: 19px;
      line-height: 2.5;
      letter-spacing: 0.05em;
    }

    /* フォーム */
    .booking-form,
    .field {
      display: grid;
    }

    .booking-form {
      grid-template-columns: 1fr 1fr;
      gap: 24px 20px;
    }

    .field {
      gap: 10px;
      font-size: 17px;
    }

    .field-wide,
    .submit-button,
    .form-note {
      grid-column: 1 / -1;
    }

    label small {
      margin-left: 6px;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid #bac3ae;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 19px;
    }

    textarea {
      resize: vertical;
    }

    .submit-button,
    .toast {
      background: var(--ink);
      color: var(--paper);
    }

    .submit-button {
      padding: 20px;
      border: 0;
      letter-spacing: 0.1em;
    }

    .form-note {
      margin: 0;
      color: #68725e;
      font-size: 15px;
      line-height: 1.8;
    }

    .copy-button {
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid #929b86;
      background: none;
      color: var(--ink);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      z-index: 20;
      max-width: 90vw;
      padding: 16px 22px;
      transform: translateX(-50%);
      color: white;
      font-size: 13px;
    }

    .toast:empty {
      display: none;
    }

    /* 画面幅の調整してるとこ */
    @media (max-width: 850px) {
      .site-header {
        column-gap: 12px;
        row-gap: 12px;
        padding: 12px 5% 20px;
      }

      .brand {
        grid-row: 1;
        width: 105px;
      }

      .social-links {
        gap: 8px;
      }

      .social-links a {
        width: 28px;
        height: 28px;
      }

      .social-links svg {
        width: 21px;
        height: 21px;
      }

      .main-nav {
        grid-column: 1 / -1;
        width: 100%;
        gap: 10px;
      }

      .nav-home {
        display: none;
      }

      .nav-button {
        flex: 1;
        width: auto;
        min-width: 0;
        min-height: 46px;
        padding: 12px 5px;
        font-size: 14px;
      }
    }

    @media (max-width: 700px) {
      .booking {
        padding: 70px 8%;
      }

      .booking-layout {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .booking-title {
        min-height: 50px;
      }

      .booking-form {
        gap: 22px 16px;
      }
    }

    @media (max-width: 400px) {
      .social-links {
        gap: 5px;
      }

      .social-links a {
        width: 25px;
      }

      .social-links .music-link {
        gap: 3px;
        padding-right: 7px;
      }

      .music-link span {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .brand {
        width: 85px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ひぐらし トップへ">
      <svg
        class="brand-logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="725 125 160 55"
        role="img"
        aria-label="ひぐらし"
      >
        <defs>
          <filter id="brand-ink" color-interpolation-filters="sRGB">
            <feColorMatrix
              type="matrix"
              values="
                0 0 0 0 .208
                0 0 0 0 .235
                0 0 0 0 .2
                -.2126 -.7152 -.0722 0 .75
              "
            />
            <feComponentTransfer>
              <feFuncA type="linear" slope="10" intercept="-.2" />
            </feComponentTransfer>
          </filter>

          <clipPath id="brand-clip" clipPathUnits="userSpaceOnUse">
            <rect x="725" y="125" width="160" height="55" />
          </clipPath>
        </defs>

        <image
          href="assets/card-original.png"
          width="1145"
          height="1395"
          clip-path="url(#brand-clip)"
          filter="url(#brand-ink)"
        />
      </svg>
    </a>

    <div class="social-links" aria-label="SNS・配信">
      <a
        class="music-link"
        href="https://www.tunecore.co.jp/artists?id=1037446"
        target="_blank"
        rel="noopener"
        aria-label="音源を聴く（TuneCore）"
        title="音源を聴く"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 17V5l11-2v12M9 9l11-2" />
          <ellipse cx="5.5" cy="17" rx="3.5" ry="2.8" />
          <ellipse cx="16.5" cy="15" rx="3.5" ry="2.8" />
        </svg>
        <span>音源</span>
      </a>

      <a
        href="https://www.instagram.com/_sonohigurashii/"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r=".7" fill="currentColor" />
        </svg>
      </a>

      <a
        href="https://x.com/_sonohigurashii"
        target="_blank"
        rel="noopener"
        aria-label="X"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4l16 16M20 4L4 20" />
        </svg>
      </a>

      <a
        href="https://www.youtube.com/@sonohigurashii"
        target="_blank"
        rel="noopener"
        aria-label="YouTube"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="4" />
          <path d="M10 9l6 3-6 3z" fill="currentColor" stroke="none" />
        </svg>
      </a>

      <a
        href="https://www.tiktok.com/@_sonohigurashii"
        target="_blank"
        rel="noopener"
        aria-label="TikTok"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 3v12a4 4 0 1 1-4-4M14 3c0 4 3 6 6 6" />
        </svg>
      </a>
    </div>

    <nav class="main-nav" aria-label="メインメニュー">
      <a class="nav-home" href="index.html">トップへ</a>
      <a class="nav-button" href="live.html">ライブ・取り置き</a>
      <a class="nav-button" href="booking.html" aria-current="page">
        出演のご依頼はこちら
      </a>
    </nav>
  </header>

  <main>
    <section class="booking" aria-labelledby="booking-title">
      <div class="booking-layout">
        <div>
          <span class="section-label">04 / BOOKING</span>

          <h1 class="booking-title" id="booking-title">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="220 0 1700 350"
              role="img"
              aria-label="出演のご依頼"
            >
              <image
                href="assets/custom-headings.png"
                width="2172"
                height="724"
              />
            </svg>
          </h1>

          <p class="description">
            ライブへのお誘いはこちらから。<br>
            日程や詳細がまだ決まっていなくても、<br>
            まずはお気軽にご相談いただければ幸いです。
          </p>
        </div>

        <form class="booking-form" id="booking-form">
          <div class="field">
            <label for="venue">
              ライブハウス・主催者名 <small>任意</small>
            </label>
            <input
              id="venue"
              name="venue"
              placeholder="例：〇〇ライブハウス"
              autocomplete="organization"
            >
          </div>

          <div class="field">
            <label for="person">
              ご担当者名 <small>任意</small>
            </label>
            <input
              id="person"
              name="person"
              placeholder="例：山田"
              autocomplete="name"
            >
          </div>

          <div class="field field-wide">
            <label for="date">
              出演希望日 <small>任意</small>
            </label>
            <input
              id="date"
              name="date"
              placeholder="例：11月中旬 ／ 日程未定"
            >
          </div>

          <div class="field field-wide">
            <label for="message">
              お誘いの内容 <small>任意</small>
            </label>
            <textarea
              id="message"
              name="message"
              rows="3"
              placeholder="イベント名、出演条件、ご相談など"
            ></textarea>
          </div>

          <button class="submit-button" type="submit">
            メールアプリで依頼文を開く ↗
          </button>

          <p class="form-note">
            空欄でも下書きを作成できます。<br>
            メールアプリで内容を確認して送信してください。<br>
            <button class="copy-button" type="button" id="copy-button">
              宛先と依頼文をコピー
            </button>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    "use strict";

    const BOOKING_EMAIL = "sonohigurashi45@gmail.com";
    const form = document.getElementById("booking-form");
    const copyButton = document.getElementById("copy-button");
    const toast = document.getElementById("toast");

    let toastTimer;

    function readField(id) {
      return document.getElementById(id).value.trim();
    }

    function createDraft() {
      const venue = readField("venue");
      const person = readField("person");
      const date = readField("date");
      const message = readField("message");

      return {
        subject: `【出演のご相談】${venue || "ライブのお誘い"}`,
        body: [
          "ひぐらし ご担当者様",
          "",
          venue || "主催者名：",
          person ? `${person}と申します。` : "担当者名：",
          "",
          "ライブへのご出演についてご相談したく、ご連絡しました。",
          "",
          `出演希望日：${date || "未定・ご相談"}`,
          "内容・条件：",
          message || "詳細をご相談させていただけますと幸いです。",
          "",
          "ご検討のほど、よろしくお願いいたします。"
        ].join("\n")
      };
    }

    function showMessage(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toastTimer = setTimeout(() => {
        toast.textContent = "";
      }, 3500);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const { subject, body } = createDraft();

      window.location.href =
        `mailto:${BOOKING_EMAIL}` +
        `?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(body)}`;
    });

    copyButton.addEventListener("click", async () => {
      const { subject, body } = createDraft();
      const text =
        `宛先：${BOOKING_EMAIL}\n件名：${subject}\n\n${body}`;

      try {
        await navigator.clipboard.writeText(text);
        showMessage("宛先と依頼文をコピーしました");
      } catch {
        showMessage(
          "コピーできませんでした。メールアプリから開いてください"
        );
      }
    });
  </script>
</body>
</html>
