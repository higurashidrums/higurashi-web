---
layout: null
section: booking
---
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひぐらし</title>

  <link rel="stylesheet" href="shared-style.css">

  <style>
    /* 出演依頼 */
    .booking-main {
      padding-top: 130px;
    }

    .booking {
      margin-top: 80px;
      padding: 100px 8%;
      background: #e9ecdf;
    }

    .booking-layout {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 12%;
    }

    .description {
      font-size: 19px;
      line-height: 2.5;
      letter-spacing: 0.05em;
    }

    /* フォーム */
    .booking-form,
    .field {
      display: grid;
    }

    .booking-form {
      grid-template-columns: 1fr 1fr;
      gap: 24px 20px;
    }

    .field {
      gap: 10px;
      font-size: 17px;
    }

    .field-wide,
    .submit-button,
    .form-note {
      grid-column: 1 / -1;
    }

    label small {
      margin-left: 6px;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid #bac3ae;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 19px;
    }

    textarea {
      resize: vertical;
    }

    .submit-button {
      background: var(--ink);
      color: var(--paper);
      padding: 20px;
      border: 0;
      letter-spacing: 0.1em;
    }

    .form-note {
      margin: 0;
      color: #68725e;
      font-size: 15px;
      line-height: 1.8;
    }

    .copy-button {
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid #929b86;
      background: none;
      color: var(--ink);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      z-index: 20;
      max-width: 90vw;
      padding: 16px 22px;
      transform: translateX(-50%);
      color: white;
      font-size: 13px;
      background: var(--ink);
    }

    .toast:empty {
      display: none;
    }

    /* 画面幅の調整してるとこ */
    @media (max-width: 700px) {
      .booking {
        padding: 70px 8%;
      }

      .booking-layout {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .booking-form {
        gap: 22px 16px;
      }
    }
    /* 相談する前に、メンバーの雰囲気も伝える */
    .booking-photo {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 32px;
    }
  </style>
</head>

<body>
{% include_relative header.html %}

  <main class="booking-main">
    <section class="booking" aria-labelledby="booking-title">
      <div class="booking-layout">
        <div>

          <h1 class="page-title" id="booking-title">出演のご依頼</h1>

          <p class="description">
            ライブへのお誘いはこちらから。<br>
            日程や詳細がまだ決まっていなくても、<br>
            まずはお気軽にご相談いただければ幸いです。
          </p>

          <img class="booking-photo" src="assets/band-peace.png" alt="笑顔でピースをする、ひぐらしのメンバー5人" width="1567" height="1045" decoding="async">
        </div>

        <form class="booking-form" id="booking-form">
          <div class="field">
            <label for="venue">
              ライブハウス・主催者名 <small>任意</small>
            </label>
            <input
              id="venue"
              name="venue"
              placeholder="例：〇〇ライブハウス"
              autocomplete="organization"
            >
          </div>

          <div class="field">
            <label for="person">
              ご担当者名 <small>任意</small>
            </label>
            <input
              id="person"
              name="person"
              placeholder="例：山田"
              autocomplete="name"
            >
          </div>

          <div class="field field-wide">
            <label for="date">
              出演希望日 <small>任意</small>
            </label>
            <input
              id="date"
              name="date"
              placeholder="例：11月中旬 ／ 日程未定"
            >
          </div>

          <div class="field field-wide">
            <label for="message">
              お誘いの内容 <small>任意</small>
            </label>
            <textarea
              id="message"
              name="message"
              rows="3"
              placeholder="イベント名、出演条件、ご相談など"
            ></textarea>
          </div>

          <button class="submit-button" type="submit">
            メールアプリで依頼文を開く ↗
          </button>

          <p class="form-note">
            空欄でも下書きを作成できます。<br>
            メールアプリで内容を確認して送信してください。<br>
            <button class="copy-button" type="button" id="copy-button">
              宛先と依頼文をコピー
            </button>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    "use strict";

    const BOOKING_EMAIL = "sonohigurashi45@gmail.com";
    const form = document.getElementById("booking-form");
    const copyButton = document.getElementById("copy-button");
    const toast = document.getElementById("toast");

    let toastTimer;

    function readField(id) {
      return document.getElementById(id).value.trim();
    }

    function createDraft() {
      const venue = readField("venue");
      const person = readField("person");
      const date = readField("date");
      const message = readField("message");

      return {
        subject: `【出演のご相談】${venue || "ライブのお誘い"}`,
        body: [
          "ひぐらし ご担当者様",
          "",
          venue || "主催者名：",
          person ? `${person}と申します。` : "担当者名：",
          "",
          "ライブへのご出演についてご相談したく、ご連絡しました。",
          "",
          `出演希望日：${date || "未定・ご相談"}`,
          "内容・条件：",
          message || "詳細をご相談させていただけますと幸いです。",
          "",
          "ご検討のほど、よろしくお願いいたします。"
        ].join("\n")
      };
    }

    function showMessage(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toastTimer = setTimeout(() => {
        toast.textContent = "";
      }, 3500);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const { subject, body } = createDraft();

      window.location.href =
        `mailto:${BOOKING_EMAIL}` +
        `?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(body)}`;
    });

    copyButton.addEventListener("click", async () => {
      const { subject, body } = createDraft();
      const text =
        `宛先：${BOOKING_EMAIL}\n件名：${subject}\n\n${body}`;

      try {
        await navigator.clipboard.writeText(text);
        showMessage("宛先と依頼文をコピーしました");
      } catch {
        showMessage(
          "コピーできませんでした。メールアプリから開いてください"
        );
      }
    });
  </script>
</body>
</html>
