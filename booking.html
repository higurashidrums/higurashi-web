<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひぐらし — 音探しの旅</title><style>
:root{--paper:#f5f2ea;--ink:#353c33;--muted:#858879;--line:#d6d8cb;--accent:#62715a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Serif JP','Yu Mincho',serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:5px}header{position:fixed;top:0;left:0;width:100%;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(var(--paper),transparent)}.brand{font-size:23px;letter-spacing:.3em}nav{display:flex;align-items:center;gap:28px;font:12px sans-serif;letter-spacing:.08em}.pill{border:1px solid var(--ink);padding:13px 23px;border-radius:40px;background:var(--paper);cursor:pointer}.hero{height:100svh;min-height:660px;position:relative;display:grid;place-items:center;overflow:hidden}.hero:before{content:'';position:absolute;width:56vw;height:56vw;max-width:750px;max-height:750px;right:-24%;top:18%;border:1px solid #d7dacd;border-radius:50%;box-shadow:0 0 0 70px #e6e8dc38,0 0 0 140px #e6e8dc22}.hero-word{writing-mode:vertical-rl;font-size:clamp(68px,9vw,124px);letter-spacing:.35em;font-weight:400;position:relative;margin:0}.side{position:absolute;left:9%;top:36%;writing-mode:vertical-rl;font-size:13px;line-height:2.3;letter-spacing:.28em}.hero-note{position:absolute;bottom:110px;right:9%;font-size:13px;line-height:2;letter-spacing:.12em}.scroll{position:absolute;bottom:36px;left:50%;font:10px sans-serif;letter-spacing:.18em;transform:translateX(-50%)}.scroll:after{content:'';display:block;height:45px;border-left:1px solid var(--muted);margin:15px auto 0;width:1px}.skip{position:absolute;bottom:38px;right:8%;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:8px}.intro{padding:140px 8% 100px;display:grid;grid-template-columns:1fr 1fr;gap:10%;align-items:center}.eyebrow{font:10px sans-serif;letter-spacing:.2em;color:var(--muted)}h2{font-weight:400;font-size:clamp(27px,3vw,42px);line-height:1.8;letter-spacing:.1em;margin:24px 0}.prose{font-size:14px;line-height:2.5;letter-spacing:.05em}.placeholder-label{font:10px sans-serif;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:18px}.photo{width:100%;aspect-ratio:4/5;object-fit:cover;filter:saturate(.65);border-radius:48% 48% 0 0}.stories{padding:0 8%}.chapter{min-height:85vh;padding:100px 0;display:grid;grid-template-columns:1.2fr 1fr;gap:10%;align-items:center;border-top:1px solid var(--line);scroll-margin-top:80px}.chapter.reverse .media{order:2}.media{aspect-ratio:16/10;background:#e7e8df;position:relative;display:grid;place-items:center;overflow:hidden}.media:before{content:'';position:absolute;inset:22px;border:1px solid #b7bdad}.media-center{text-align:center;position:relative}.play{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 24px;border:1px solid #818b77;border-radius:50%;font-size:18px}.media p{font-size:12px;letter-spacing:.1em}.media small{font:10px sans-serif;color:var(--muted)}.number{font:12px sans-serif;letter-spacing:.15em;color:var(--muted)}.details{display:flex;gap:20px;margin-top:32px;font-size:12px}.details a{border-bottom:1px solid var(--line);padding-bottom:6px}.booking{margin-top:80px;padding:100px 8%;background:#e9ecdf;scroll-margin-top:70px}.booking-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:12%}.booking h2{margin-top:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:24px 20px}.field{display:grid;gap:10px;font:12px sans-serif}.field.wide{grid-column:1/-1}label small{color:var(--muted);margin-left:6px}input,textarea{border:none;border-bottom:1px solid #bac3ae;background:transparent;padding:12px 0;color:var(--ink);border-radius:0;width:100%;font-size:14px}textarea{resize:vertical}.send{grid-column:1/-1;border:0;background:var(--ink);color:var(--paper);padding:20px;cursor:pointer;letter-spacing:.1em}.form-note{grid-column:1/-1;font:11px/1.8 sans-serif;color:#68725e;margin:0}.copy{background:none;border:0;border-bottom:1px solid #929b86;cursor:pointer;color:var(--ink);padding:5px 0}.live{padding:100px 8%;display:grid;grid-template-columns:1fr 1fr;gap:10%;scroll-margin-top:70px}.live-row{padding:23px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}footer{border-top:1px solid var(--line);margin:0 8%;padding:40px 0 85px;display:flex;justify-content:space-between;font:11px sans-serif;color:var(--muted)}.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s,transform 1s}.reveal.visible{opacity:1;transform:none}.demo-tag{position:fixed;left:18px;bottom:16px;font:9px sans-serif;color:var(--muted);z-index:3}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:16px 22px;font:13px sans-serif;z-index:20;display:none}@media(max-width:700px){header{padding:20px 6%}.brand{font-size:19px}nav{gap:12px}nav .optional{display:none}.pill{padding:11px 15px;font-size:11px}.hero{min-height:630px}.side{left:10%;font-size:11px}.hero-note{right:8%;bottom:110px;font-size:11px}.hero-word{font-size:82px}.intro,.chapter,.booking-grid,.live{grid-template-columns:1fr;gap:40px}.intro{padding:90px 8%}.intro .photo{max-height:440px}.chapter{padding:65px 0;min-height:0}.chapter.reverse .media{order:0}h2{font-size:29px}.booking{padding:70px 8%}.form{gap:22px 16px}footer{gap:25px;flex-direction:column}.hero:before{width:100vw;height:100vw;right:-55%;top:30%}.live{padding:70px 8%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}

.contact-options{display:grid;grid-template-columns:1fr 1fr;margin:80px 8% 100px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.contact-options .booking{margin:0;padding:60px 10%;background:#e9ecdf}.contact-options .booking-grid{grid-template-columns:1fr;gap:28px}.contact-options .booking h2,.contact-options .live h2{font-size:32px}.contact-options .live{padding:60px 10%;grid-template-columns:1fr;gap:28px;align-content:start;background:#efeee7}.contact-options .live-row{gap:16px;line-height:1.8}.contact-options .live .prose{margin-bottom:0}.contact-options .booking .prose{margin-bottom:0}@media(max-width:850px){.contact-options{grid-template-columns:1fr;margin:60px 8%}.contact-options .booking,.contact-options .live{padding:45px 8%}.contact-options .booking h2,.contact-options .live h2{font-size:29px}}
</style></head><body><header><a class="brand" href="index.html">ひぐらし</a><nav><a href="index.html">トップに戻る ↗</a></nav></header><main style="padding-top:80px"><section class="booking" id="booking"><div class="booking-grid"><div><span class="eyebrow">04 / BOOKING</span><h2>次の出会いを、<br>あなたのステージで。</h2><p class="prose">ライブへのお誘いはこちらから。<br>日程や詳細がまだ決まっていなくても、<br>まずはお気軽にご相談ください。</p><p style="font:11px/2 sans-serif;color:#68725e">デモ：入力内容から依頼メールの下書きを作ります。<br>宛先は現サイト掲載のアドレスです。</p></div><form class="form" id="bookingForm"><div class="field"><label for="venue">ライブハウス・主催者名 <small>任意</small></label><input id="venue" placeholder="例：〇〇ライブハウス"></div><div class="field"><label for="person">ご担当者名 <small>任意</small></label><input id="person" placeholder="例：山田"></div><div class="field wide"><label for="date">出演希望日 <small>任意</small></label><input id="date" placeholder="例：11月中旬 ／ 日程未定"></div><div class="field wide"><label for="message">お誘いの内容 <small>任意</small></label><textarea id="message" rows="3" placeholder="イベント名、出演条件、ご相談など"></textarea></div><button class="send" type="submit">メールアプリで依頼文を開く ↗</button><p class="form-note">空欄でも下書きを作成できます。メールアプリで内容を確認して送信してください。<br><button class="copy" type="button" id="copy">宛先と依頼文をコピー</button></p></form></div></section>
</main><div class="toast" id="toast" role="status"></div><script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const address='sonohigurashi45@gmail.com';function draft(){const val=id=>document.getElementById(id).value.trim();const venue=val('venue'),person=val('person'),date=val('date'),message=val('message');return{subject:'【出演のご相談】'+(venue||'ライブのお誘い'),body:'ひぐらし ご担当者様\n\n'+(venue||'主催者名：')+'\n'+(person?person+'と申します。':'担当者名：')+'\n\nライブへのご出演についてご相談したく、ご連絡しました。\n\n出演希望日：'+(date||'未定・ご相談')+'\n内容・条件：\n'+(message||'詳細をご相談させていただけますと幸いです。')+'\n\nご検討のほど、よろしくお願いいたします。'}}document.getElementById('bookingForm').addEventListener('submit',e=>{e.preventDefault();const d=draft();window.location.href='mailto:'+address+'?subject='+encodeURIComponent(d.subject)+'&body='+encodeURIComponent(d.body)});document.getElementById('copy').addEventListener('click',async()=>{const d=draft(),s='宛先：'+address+'\n件名：'+d.subject+'\n\n'+d.body;try{await navigator.clipboard.writeText(s);show('宛先と依頼文をコピーしました')}catch{show('コピーできませんでした。メールアプリから開いてください')}});function show(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
</script></body></html>
