const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const film=document.querySelector('.film-story'),video=document.getElementById('liveVideo'),sound=document.getElementById('soundToggle');let started=false;const filmObserver=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){if(!started){video.load();started=true}video.play().catch(()=>{});}else{video.pause();}})},{threshold:0});filmObserver.observe(film);sound.addEventListener('click',()=>{video.muted=!video.muted;video.play().catch(()=>{});sound.textContent=video.muted?'音を聴く ♪':'音を止める ✕';sound.setAttribute('aria-pressed',String(!video.muted))});function tint(){const r=film.getBoundingClientRect();document.body.classList.toggle('film-active',r.top<=80&&r.bottom>80)}window.addEventListener('scroll',tint,{passive:true});tint();
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;let autoScrollTimer;const cancelAutoScroll=()=>clearTimeout(autoScrollTimer);if(!reduceMotion&&window.scrollY<20&&!window.location.hash){autoScrollTimer=setTimeout(()=>{if(window.scrollY<20)document.getElementById('concept').scrollIntoView({behavior:'smooth',block:'start'})},3000);for(const name of ['wheel','touchstart','pointerdown','keydown','scroll'])window.addEventListener(name,cancelAutoScroll,{once:true,passive:true});}
